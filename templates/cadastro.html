{% extends "home.html" %}
{% block titulo %}Cadastro{% endblock %}
{% block conteudo %}
<section class="auth-section">
  <h1 class="secao">Criar conta</h1>
  <form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="botao">Criar conta</button>
  </form>
  <p style="text-align: center; margin-top: 1.5rem;">
    Já tem conta? <a href="{% url 'login' %}" style="font-weight: bold;">Entrar</a>
  </p>
</section>
{% endblock %}
