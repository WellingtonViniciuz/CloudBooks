{% extends "home.html" %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<section class="auth-section" style="max-width: 500px; margin: 2rem auto; background: var(--cor-paineis); padding: 3rem 2rem; border-radius: 12px; border: 1px solid var(--cor-roxo-principal); text-align: center;">
  <h1 class="secao" style="margin-top: 0; border-bottom: none;">Entrar</h1>
  
  <form method="post" class="formulario" style="text-align: left;">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    
    {% if erro %}
    <p class="erro" style="color: var(--cor-erro); background: rgba(255, 107, 139, 0.1); padding: 0.8rem; border-radius: 8px; border-left: 4px solid var(--cor-erro);">{{ erro }}</p>
    {% endif %}
    
    <button type="submit" class="botao" style="width: 100%; margin-top: 1rem;">Entrar</button>
  </form>
  
  <p style="margin-top: 2rem; color: var(--cor-texto-suave);">
    Ainda não tem conta? <a href="{% url 'cadastro' %}" style="font-weight: bold; color: var(--cor-dourado-principal);">Cadastre-se</a>
  </p>
</section>
{% endblock %}
