{% extends "home.html" %}
{% block classe_corpo %}entrada-pagina{% endblock %}

{% block cabecalho %}
<header class="topo-entrada">
  <nav aria-label="Acesso à conta" class="auth-buttons">
    <a class="btn-login" href="{% url 'login' %}">Login</a>
    <a class="btn-criar-conta" href="{% url 'cadastro' %}">Criar conta</a>
  </nav>
</header>
{% endblock %}

{% block conteudo %}
<section class="entrada">
  <h1>CloudBooks</h1>
  <p>Um universo de histórias esperando por você.</p>
  
  <div class="acoes">
    <a class="botao" href="{% url 'home' %}" aria-label="Explorar o catálogo de livros">
      Explorar o Catálogo <span aria-hidden="true" style="margin-left: 8px;">&rarr;</span>
    </a>
  </div>
</section>
{% endblock %}
